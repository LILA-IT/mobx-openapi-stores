# Git hooks for conventional commits and local quality gates.
# CI remains authoritative for full matrix / security scans.

commit-msg:
  commands:
    commitlint:
      run: yarn commitlint --edit {1}

pre-commit:
  parallel: true
  commands:
    eslint:
      glob: '*.{ts,tsx,js,mjs,cjs}'
      run: yarn eslint --fix {staged_files}
      stage_fixed: true
    prettier:
      glob: '*.{ts,tsx,js,mjs,cjs,json,md,yml,yaml}'
      run: yarn prettier --write {staged_files}
      stage_fixed: true

pre-push:
  parallel: false
  commands:
    type-check:
      run: yarn type-check
    test:
      run: yarn test
